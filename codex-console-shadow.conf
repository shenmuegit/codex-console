[Unit]
Description=Share the existing KDE Codex window with Xpra
StartLimitIntervalSec=0

[Service]
Environment=DISPLAY=:10
Environment=XAUTHORITY=%h/.Xauthority
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus
Environment=PULSE_SERVER=unix:%t/pulse/native
ExecStart=
ExecStart=/usr/bin/xpra shadow ":10,windows=class=^chatgpt.*Codex[)]$$/class=^ChatGPT$$" --bind-ws=0.0.0.0:15443,auth=file:filename=%h/.local/state/codex-console/password --ssl=no --html=%h/.local/state/codex-console/www --http-scripts=off --daemon=no --attach=no --systemd-run=no --start-via-proxy=no --use-display=yes --resize-display=no --readonly=no --sharing=yes --tray=no --notifications=no --mdns=no --audio=yes --pulseaudio=no --speaker=on --microphone=disabled --webcam=no --printing=no --file-transfer=no --open-files=no --open-url=no --start-new-commands=no --shell=no --exit-with-client=no --exit-with-children=no --terminate-children=no --session-name="Codex KDE" --log-dir=%h/.local/state/codex-console --log-file=shadow.log
Restart=always
RestartSec=10
