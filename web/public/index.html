<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>Codex Console</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="login-panel" class="login-panel">
    <p class="eyebrow">CODEX CONSOLE</p>
    <h1>回到你的工作</h1>
    <p class="muted">连接主机上的 Codex。</p>
    <form id="login-form">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required aria-describedby="login-error">
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="primary">登录</button>
    </form>
  </main>
  <main id="workspace" hidden>
    <header class="topbar"><strong>Codex Console</strong><span id="connection" role="status">正在连接…</span></header>
    <div class="work-layout" data-level="projects">
      <aside class="projects-pane" aria-label="项目">
        <div class="pane-heading"><h2>项目</h2></div>
        <nav id="projects" aria-label="项目列表"></nav>
        <button id="more-projects" hidden>更多项目</button>
      </aside>
      <aside class="threads-pane" aria-label="会话">
        <div class="pane-heading"><button class="mobile-back" id="back-projects">项目</button><h2 id="project-title">全部会话</h2></div>
        <div class="toolbar"><button id="new-thread" class="primary">新建会话</button></div>
        <label class="check-label"><input id="show-archived-threads" type="checkbox">显示归档会话（点击恢复）</label>
        <nav id="threads" aria-label="会话列表"></nav><button id="more-threads" hidden>更多会话</button>
      </aside>
      <section class="chat-pane" aria-label="聊天">
        <header class="chat-heading">
          <button class="mobile-back" id="back-threads">会话</button>
          <div class="thread-title"><h1 id="thread-title">选择或新建一个会话</h1></div>
        </header>
        <p id="effective-settings" class="muted chat-meta"></p>
        <div class="model-controls chat-meta"><label for="model">下轮模型</label><select id="model" disabled></select><label for="effort">思考强度</label><select id="effort" disabled></select></div>
        <p class="muted chat-meta">下轮生效；后续调整也会影响仍在排队的消息。</p>
        <div class="usage-strip chat-meta"><span id="context-usage">上下文未知</span><meter id="context-meter" min="0" max="100" aria-label="上下文使用比例" hidden></meter><button id="show-usage">七天额度</button></div>
        <div id="chat-feed" class="chat-feed" tabindex="0" aria-label="聊天记录">
          <button id="older-history" hidden>加载更早记录</button><div id="messages"></div>
          <p id="chat-empty" class="empty muted">从左侧打开会话，继续你的工作。</p>
        </div>
        <section id="native-requests" aria-label="待回答的原生请求"></section>
        <div id="chat-error" class="error chat-meta" role="alert"></div>
        <form id="composer" class="composer">
          <div id="attachments" aria-label="待发送附件"></div>
          <input id="file-input" type="file" multiple hidden><input id="photo-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <div id="completion-menu" role="listbox" aria-label="原生补全" hidden></div>
          <label class="sr-only" for="draft">发送消息</label><textarea id="draft" rows="3" placeholder="给 Codex 发送消息… 输入 @、$ 或 /" aria-autocomplete="list" aria-controls="completion-menu" aria-expanded="false" disabled></textarea>
          <p class="muted small composer-hint">@ 文件、目录、会话或应用 · $ 技能 · / 命令；会话引用使用只读的发送时快照。</p>
          <div class="composer-footer"><span id="turn-status" class="muted" role="status"></span>
            <button id="choose-files" type="button" disabled>文件</button><button id="choose-photos" type="button" disabled>照片</button>
            <label id="send-mode-label" hidden>运行中输入<select id="send-mode"><option value="steer">补充当前轮次</option><option value="queue">排队到下一轮</option></select></label>
            <button id="retry-uncertain" type="button" hidden>核对后重新发送</button>
            <button id="stop-turn" type="button" hidden>停止</button><button id="send" type="submit" class="primary" disabled>发送</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <dialog id="info-dialog"><div class="pane-heading"><h2 id="info-title">会话信息</h2><button id="close-info">关闭</button></div><pre id="info-body"></pre></dialog>
  <dialog id="usage-dialog"><div class="pane-heading"><h2>账号七天额度</h2><button id="close-usage">关闭</button></div>
    <p class="muted small">同一账号的滚动七天窗口，与本会话的上下文用量分别计算。</p>
    <div id="weekly-usage">正在读取…</div><p id="usage-error" class="error" role="alert"></p><button id="refresh-usage">刷新额度</button>
  </dialog>
  <div id="thread-menu" class="thread-menu" popover role="menu" aria-label="会话选项" hidden>
    <button id="thread-menu-copy" type="button" role="menuitem">复制线程 ID</button>
    <button id="thread-menu-archive" type="button" role="menuitem">归档会话</button>
    <button id="thread-menu-delete" class="danger" type="button" role="menuitem">删除会话</button>
  </div>
</body>
</html>
